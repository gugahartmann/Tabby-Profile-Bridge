name: Test and GitHub Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without lifecycle scripts
        run: npm install --legacy-peer-deps --ignore-scripts --no-fund
      - name: Unit tests
        run: npm test
      - name: Build Tabby plugin
        run: npm run build
      - name: Inspect package
        run: |
          mkdir -p release-out
          npm pack --pack-destination release-out
          test -s dist/index.js
          test -s release-out/tabby-profile-bridge-*.tgz
      - name: Publish immutable GitHub release if explicitly requested
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          if [ ! -f ".github/release-requests/$TAG.txt" ]; then
            echo "No release request for $TAG"
            exit 0
          fi
          [ "$(cat .github/release-requests/$TAG.txt | tr -d '\r\n')" = "$TAG" ]
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, not modifying it"
            exit 0
          fi
          gh release create "$TAG" release-out/tabby-profile-bridge-"$VERSION".tgz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tabby Profile Bridge $TAG" --generate-notes
